          - { label: "Voluntarios del club", name: "volunteersInvolved", widget: "number", required: false }
          - { label: "Área restaurada", name: "areaRestored", widget: "string", required: false, hint: "Ej: 2 hectáreas" }
          - { label: "Personas capacitadas", name: "trainedPeople", widget: "number", required: false }
