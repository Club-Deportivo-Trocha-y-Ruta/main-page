# ============================================================
# Sveltia CMS Configuration
# Club Deportivo Trocha y Ruta
# ============================================================

backend:
  name: github
  repo: Club-Deportivo-Trocha-y-Ruta/main-page
  branch: main
  commit_messages:
    create: 'content: crea {{collection}} "{{slug}}"'
    update: 'content: actualiza {{collection}} "{{slug}}"'
    delete: 'content: elimina {{collection}} "{{slug}}"'
    uploadMedia: 'media: sube "{{path}}"'
    deleteMedia: 'media: elimina "{{path}}"'

# Workflow editorial (draft → review → ready → published)
publish_mode: editorial_workflow

# Carpeta de medios
media_folder: "src/assets/images"
public_folder: "/src/assets/images"

# Locale en español
locale: "es"

# Tamaño máximo de archivos (5MB)
media_library:
  max_file_size: 5242880

# Logo en el panel de admin
logo_url: "/images/logo.png"

# Slug configuration
slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

# ============================================================
# COLECCIONES
# ============================================================

collections:

  # ----------------------------------------------------------
  # NOTICIAS
  # ----------------------------------------------------------
  - name: "news"
    label: "Noticias"
    label_singular: "Noticia"
    folder: "src/content/news"
    create: true
    slug: "{{year}}-{{month}}-{{slug}}"
    sortable_fields: ["date", "title"]
    view_groups:
      - label: "Categoría"
        field: category
      - label: "Año"
        field: date
        pattern: '\d{4}'
    summary: "{{date | date('YYYY-MM-DD')}} — {{title}}"
    fields:
      - { label: "Título", name: "title", widget: "string", required: true }
      # Con hora: Google News ordena las noticias por marca de tiempo, y una
      # crónica publicada el mismo día de la válida compite por frescura.
      # El offset `-05:00` lo escribe el widget a partir de `picker_utc: false`.
      - { label: "Fecha y hora de publicación", name: "date", widget: "datetime", required: true, format: "YYYY-MM-DDTHH:mm:ssZ", date_format: "DD/MM/YYYY", time_format: "HH:mm", picker_utc: false }
      - { label: "Fecha y hora de actualización", name: "updatedDate", widget: "datetime", required: false, format: "YYYY-MM-DDTHH:mm:ssZ", date_format: "DD/MM/YYYY", time_format: "HH:mm", picker_utc: false }
      - { label: "Autor", name: "author", widget: "string", default: "Juan Diego García" }
      - label: "Categoría"
        name: "category"
        widget: "select"
        options:
          - { label: "Competencias", value: "competencias" }
          - { label: "Club", value: "club" }
          - { label: "Entrenamiento", value: "entrenamiento" }
          - { label: "Comunidad", value: "comunidad" }
      - { label: "Tags", name: "tags", widget: "list", required: false, allow_add: true }
      - { label: "Imagen principal", name: "image", widget: "image", required: true, media_folder: "/src/assets/images/news" }
      - { label: "Texto alternativo imagen", name: "imageAlt", widget: "string", required: false }
      - { label: "Extracto", name: "excerpt", widget: "text", required: true, hint: "Máximo 200 caracteres" }
      - { label: "Destacada", name: "featured", widget: "boolean", default: false }
      - { label: "Borrador", name: "draft", widget: "boolean", default: true }
      - { label: "Evento relacionado (slug)", name: "relatedEvent", widget: "string", required: false }
      - { label: "Galería relacionada (slug)", name: "relatedGallery", widget: "string", required: false }
      - label: "Lineup de corredores"
        name: "lineup"
        widget: "list"
        required: false
        collapsed: true
        hint: "Lista ordenada de corredores destacados en la noticia (mejor a peor resultado)"
        fields:
          - { label: "Nombre", name: "name", widget: "string" }
          - { label: "Categoría", name: "category", widget: "string", hint: "Ej: Pre Juvenil A Femenina, Élite, Infantil A" }
          - { label: "Slug del corredor", name: "slug", widget: "string", hint: "Identificador en kebab-case, ej: isabel-quinones" }
          - { label: "Foto", name: "image", widget: "image", hint: "Ruta a la imagen del corredor (recomendado WebP)" }
      - label: "SEO"
        name: "seo"
        widget: "object"
        collapsed: true
        required: false
        fields:
          - { label: "Meta título", name: "metaTitle", widget: "string", required: false }
          - { label: "Meta descripción", name: "metaDescription", widget: "text", required: false, hint: "Máximo 160 caracteres" }
          - { label: "Imagen OG", name: "ogImage", widget: "image", required: false }
      - { label: "Contenido", name: "body", widget: "markdown" }

  # ----------------------------------------------------------
  # EVENTOS
  # ----------------------------------------------------------
  - name: "events"
    label: "Eventos"
    label_singular: "Evento"
    folder: "src/content/events"
    create: true
    slug: "{{year}}-{{month}}-{{slug}}"
    sortable_fields: ["date", "title"]
    view_groups:
      - label: "Categoría"
        field: category
      - label: "Estado"
        field: status
    summary: "{{date | date('YYYY-MM-DD')}} — {{title}} [{{status}}]"
    fields:
      - { label: "Título", name: "title", widget: "string", required: true }
      - { label: "URL propia", name: "urlSlug", widget: "string", required: false, pattern: ["^[a-z0-9]+(?:-[a-z0-9]+)*$", "Solo minúsculas, números y guiones: copa-valle-yumbo-2026"], hint: "Sin el prefijo de fecha: copa-valle-yumbo-2026. Si se deja vacío se usa el nombre del archivo. Cambiarlo rompe los enlaces ya compartidos. No usar el nombre 'slug': Astro lo trata como reservado." }
      - { label: "Fecha inicio", name: "date", widget: "datetime", required: true, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
      - { label: "Fecha fin", name: "endDate", widget: "datetime", required: false, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
      - { label: "Última revisión", name: "updatedAt", widget: "datetime", required: false, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false, hint: "Cuándo se contrastaron estos datos con la convocatoria oficial." }
      - { label: "Ubicación", name: "location", widget: "string", required: true }
      - { label: "Sede (slug)", name: "venueSlug", widget: "string", required: false, hint: "Identificador estable del lugar: pista-carlos-castro" }
      - { label: "Ciudad", name: "city", widget: "string", required: false }
      - { label: "Departamento", name: "department", widget: "string", default: "Valle del Cauca" }
      - { label: "URL del mapa", name: "mapUrl", widget: "string", required: false }
      - label: "Categoría"
        name: "category"
        widget: "select"
        options:
          - { label: "XCO (Cross-Country Olímpico)", value: "xco" }
          - { label: "XCM (Cross-Country Maratón)", value: "xcm" }
          - { label: "Ruta", value: "ruta" }
          - { label: "Enduro", value: "enduro" }
          - { label: "Recreativo", value: "recreativo" }
          - { label: "Social", value: "social" }
          - { label: "Entrenamiento", value: "entrenamiento" }
      - label: "Nivel"
        name: "level"
        widget: "select"
        default: "departamental"
        options:
          - { label: "Interno", value: "interno" }
          - { label: "Municipal", value: "municipal" }
          - { label: "Departamental", value: "departamental" }
          - { label: "Regional", value: "regional" }
          - { label: "Nacional", value: "nacional" }
          - { label: "Internacional", value: "internacional" }
      - { label: "Organizador", name: "organizer", widget: "string", required: false }
      - { label: "Imagen", name: "image", widget: "image", required: false, media_folder: "/src/assets/images/events" }
      - { label: "Texto alternativo imagen", name: "imageAlt", widget: "string", required: false }
      - label: "Estado"
        name: "status"
        widget: "select"
        default: "upcoming"
        options:
          - { label: "Próximo", value: "upcoming" }
          - { label: "En curso", value: "ongoing" }
          - { label: "Pasado", value: "past" }
          - { label: "Cancelado", value: "cancelled" }
      - { label: "URL de inscripción", name: "registrationUrl", widget: "string", required: false }
      - { label: "Fecha límite inscripción", name: "registrationDeadline", widget: "datetime", required: false, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
      - label: "Circuito"
        name: "circuit"
        widget: "object"
        collapsed: true
        required: false
        hint: "Solo lo que esté en la convocatoria oficial. El desnivel no se publica: la altimetría de un GPS de celular se desvía demasiado."
        fields:
          - { label: "Kilómetros por vuelta", name: "distanceKm", widget: "number", value_type: "float", required: true }
          - { label: "Vueltas", name: "laps", widget: "number", value_type: "int", required: false }
          - { label: "Superficie", name: "surface", widget: "string", required: false }
      - label: "Valores de inscripción"
        name: "fees"
        widget: "list"
        required: false
        label_singular: "Valor"
        summary: "{{fields.label}} — {{fields.amount}}"
        fields:
          - { label: "Concepto", name: "label", widget: "string", required: true }
          - { label: "Valor en pesos", name: "amount", widget: "number", value_type: "int", required: true }
      - { label: "Cupos por categoría", name: "capacity", widget: "number", value_type: "int", required: false }
      - label: "Cronograma del día"
        name: "schedule"
        widget: "list"
        required: false
        label_singular: "Momento"
        summary: "{{fields.time}} — {{fields.title}}"
        hint: "Lo que no es una largada: entrega de números, congresillo, premiaciones."
        fields:
          - { label: "Hora", name: "time", widget: "string", required: true, pattern: ["^([01][0-9]|2[0-3]):[0-5][0-9]$", "Hora en 24 horas: 07:00, 13:00"] }
          - { label: "Qué pasa", name: "title", widget: "string", required: true }
          - { label: "Dónde", name: "place", widget: "string", required: false }
      - label: "Categorías"
        name: "categories"
        widget: "list"
        required: false
        label_singular: "Categoría"
        summary: "{{fields.name}}"
        hint: "Los rangos de edad y las vueltas los define el organizador. Si no están confirmados, dejar la lista vacía: el bloque no se pinta."
        fields:
          - { label: "Nombre", name: "name", widget: "string", required: true }
          - { label: "Manga", name: "group", widget: "string", required: false, hint: "Primera manga, Segunda manga…" }
          - { label: "Hora de largada", name: "startTime", widget: "string", required: false, pattern: ["^([01][0-9]|2[0-3]):[0-5][0-9]$", "Hora en 24 horas: 08:30, 12:40"] }
          - { label: "Edad mínima", name: "ageMin", widget: "number", value_type: "int", required: false }
          - { label: "Edad máxima", name: "ageMax", widget: "number", value_type: "int", required: false }
          - { label: "Vueltas", name: "laps", widget: "number", value_type: "int", required: false }
          - { label: "Recorrido", name: "course", widget: "string", required: false, hint: "SOLO si no da la vuelta completa: «70% de la pista», «Recorrido especial», «Pista alterna». Llenarlo impide que la página calcule los kilómetros, que en un trazado más corto serían falsos." }
      - { label: "Galería relacionada (slug)", name: "relatedGallery", widget: "string", required: false }
      - { label: "Noticias relacionadas (slugs)", name: "relatedNews", widget: "list", required: false }
      - { label: "URL de resultados", name: "resultsUrl", widget: "string", required: false }
      - { label: "Destacado", name: "featured", widget: "boolean", default: false }
      - { label: "Borrador", name: "draft", widget: "boolean", default: true }
      - label: "SEO"
        name: "seo"
        widget: "object"
        collapsed: true
        required: false
        fields:
          - { label: "Meta título", name: "metaTitle", widget: "string", required: false }
          - { label: "Meta descripción", name: "metaDescription", widget: "text", required: false }
          - { label: "Imagen OG", name: "ogImage", widget: "image", required: false }
      - { label: "Descripción", name: "body", widget: "markdown", hint: "Solo lo que ningún campo cubre: contexto, recorrido, premiación. El circuito, los valores, los cupos y el cierre se pintan desde sus campos — repetirlos aquí deja dos versiones del mismo dato." }

  # ----------------------------------------------------------
  # CORREDORES
  # ----------------------------------------------------------
  - name: "riders"
    label: "Corredores"
    label_singular: "Corredor"
    folder: "src/content/riders"
    create: true
    slug: "{{slug}}"
    sortable_fields: ["name", "category"]
    view_groups:
      - label: "Categoría"
        field: category
      - label: "Nivel"
        field: level
    summary: "{{name}} — {{category}}"
    fields:
      - { label: "Nombre completo", name: "name", widget: "string", required: true }
      - { label: "Foto", name: "photo", widget: "image", required: true, media_folder: "/src/assets/images/riders" }
      - { label: "Fecha de nacimiento", name: "birthDate", widget: "datetime", required: true, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
      - label: "Categoría"
        name: "category"
        widget: "select"
        options:
          - { label: "Pre-infantil (4-7)", value: "pre-infantil" }
          - { label: "Infantil (8-11)", value: "infantil" }
          - { label: "Juvenil (12-15)", value: "juvenil" }
          - { label: "Sub-23 (16-22)", value: "sub23" }
          - { label: "Elite (23+)", value: "elite" }
          - { label: "Master (30+)", value: "master" }
      - { label: "Grupo de edad", name: "ageGroup", widget: "string", required: false, hint: "Ej: Pre-infantil A (4-5)" }
      - label: "Nivel"
        name: "level"
        widget: "select"
        default: "formación"
        options:
          - { label: "Iniciación", value: "iniciación" }
          - { label: "Formación", value: "formación" }
          - { label: "Competición", value: "competición" }
          - { label: "Alto rendimiento", value: "alto-rendimiento" }
      - label: "Especialidad"
        name: "specialty"
        widget: "select"
        required: false
        options:
          - { label: "XCO", value: "xco" }
          - { label: "XCM", value: "xcm" }
          - { label: "Enduro", value: "enduro" }
          - { label: "Ruta", value: "ruta" }
          - { label: "Múltiple", value: "múltiple" }
      - { label: "Número de dorsal", name: "dorsalNumber", widget: "number", required: false }
      - { label: "Año de ingreso", name: "yearJoined", widget: "number", required: false }
      - label: "Logros"
        name: "achievements"
        widget: "list"
        required: false
        collapsed: true
        fields:
          - { label: "Año", name: "year", widget: "number" }
          - { label: "Evento", name: "event", widget: "string" }
          - { label: "Posición", name: "position", widget: "number", required: false }
          - { label: "Descripción", name: "description", widget: "string" }
      - label: "Redes sociales"
        name: "socialMedia"
        widget: "object"
        collapsed: true
        required: false
        fields:
          - { label: "Instagram", name: "instagram", widget: "string", required: false }
          - { label: "Facebook", name: "facebook", widget: "string", required: false }
          - { label: "Strava", name: "strava", widget: "string", required: false }
          - { label: "YouTube", name: "youtube", widget: "string", required: false }
          - { label: "TikTok", name: "tiktok", widget: "string", required: false }
      - { label: "Programa (slug)", name: "program", widget: "string", required: false }
      - { label: "Activo", name: "active", widget: "boolean", default: true }
      - { label: "Destacado", name: "featured", widget: "boolean", default: false }
      - { label: "Orden", name: "order", widget: "number", default: 0 }
      - { label: "Borrador", name: "draft", widget: "boolean", default: false }
      - label: "SEO"
        name: "seo"
        widget: "object"
        collapsed: true
        required: false
        fields:
          - { label: "Meta título", name: "metaTitle", widget: "string", required: false }
          - { label: "Meta descripción", name: "metaDescription", widget: "text", required: false }
          - { label: "Imagen OG", name: "ogImage", widget: "image", required: false }
      - { label: "Biografía", name: "body", widget: "markdown", required: false }

  # ----------------------------------------------------------
  # DIRECTIVOS
  # ----------------------------------------------------------
  - name: "directivos"
    label: "Directivos y Staff"
    label_singular: "Directivo"
    folder: "src/content/directivos"
    create: true
    slug: "{{slug}}"
    sortable_fields: ["name", "role"]
    summary: "{{name}} — {{roleLabel}}"
    fields:
      - { label: "Nombre completo", name: "name", widget: "string", required: true }
      - { label: "Foto", name: "photo", widget: "image", required: false, media_folder: "/src/assets/images/directivos" }
      - label: "Rol"
        name: "role"
        widget: "select"
        options:
          - { label: "Presidente", value: "presidente" }
          - { label: "Vicepresidente", value: "vicepresidente" }
          - { label: "Secretario(a)", value: "secretario" }
          - { label: "Tesorero(a)", value: "tesorero" }
          - { label: "Fiscal", value: "fiscal" }
          - { label: "Vocal", value: "vocal" }
          - { label: "Entrenador principal", value: "entrenador-principal" }
          - { label: "Entrenador", value: "entrenador" }
          - { label: "Preparador físico", value: "preparador-fisico" }
          - { label: "Mecánico", value: "mecanico" }
          - { label: "Médico", value: "medico" }
          - { label: "Coordinador(a)", value: "coordinador" }
      - { label: "Título del cargo", name: "roleLabel", widget: "string", required: true, hint: "Ej: Director Técnico, Entrenador Infantil" }
      - { label: "Biografía corta", name: "bio", widget: "text", required: false }
      - { label: "Email", name: "email", widget: "string", required: false }
      - { label: "Teléfono", name: "phone", widget: "string", required: false }
      - label: "Redes sociales"
        name: "socialMedia"
        widget: "object"
        collapsed: true
        required: false
        fields:
          - { label: "Instagram", name: "instagram", widget: "string", required: false }
          - { label: "Facebook", name: "facebook", widget: "string", required: false }
          - { label: "Strava", name: "strava", widget: "string", required: false }
          - { label: "YouTube", name: "youtube", widget: "string", required: false }
          - { label: "TikTok", name: "tiktok", widget: "string", required: false }
      - { label: "Certificaciones", name: "certifications", widget: "list", required: false }
      - { label: "Año de ingreso", name: "yearJoined", widget: "number", required: false }
      - { label: "Activo", name: "active", widget: "boolean", default: true }
      - { label: "Borrador", name: "draft", widget: "boolean", default: false, hint: "En borrador la ficha no se publica. Úsalo mientras no haya autorización de imagen firmada." }
      - { label: "Orden", name: "order", widget: "number", default: 0 }
      - { label: "Biografía", name: "body", widget: "markdown", required: false }

  # ----------------------------------------------------------
  # PROGRAMAS
  # ----------------------------------------------------------
  - name: "programs"
    label: "Programas"
    label_singular: "Programa"
    folder: "src/content/programs"
    create: true
    slug: "{{slug}}"
    sortable_fields: ["title", "order"]
    summary: "{{title}} ({{ageRange}})"
    fields:
      - { label: "Título", name: "title", widget: "string", required: true }
      - { label: "Subtítulo", name: "subtitle", widget: "string", required: false }
      - { label: "Resumen", name: "summary", widget: "text", required: false, hint: "Una o dos frases con la promesa del programa. Es lo que se lee en las tarjetas de inicio y en la página de programas." }
      - { label: "Icono (Phosphor)", name: "icon", widget: "string", required: true, hint: "Nombre del icono de Phosphor Icons" }
      - { label: "Imagen", name: "image", widget: "image", required: false, media_folder: "/src/assets/images/programs" }
      - { label: "Rango de edad (texto)", name: "ageRange", widget: "string", required: true, hint: "Ej: 4 a 8 años" }
      - { label: "Edad mínima", name: "ageMin", widget: "number", required: true }
      - { label: "Edad máxima", name: "ageMax", widget: "number", required: true }
      - label: "Nivel objetivo"
        name: "targetLevel"
        widget: "select"
        options:
          - { label: "Iniciación", value: "iniciación" }
          - { label: "Formación", value: "formación" }
          - { label: "Competición", value: "competición" }
          - { label: "Recreativo", value: "recreativo" }
      - { label: "Horario", name: "schedule", widget: "string", required: true }
      - label: "Sesiones (día y hora)"
        name: "sessions"
        widget: "list"
        required: false
        collapsed: true
        summary: "{{fields.day}} · {{fields.start}} a {{fields.end}}"
        hint: "Opcional, pero es lo que permite anunciar «Próxima sesión» en la página de inicio. Una entrada por día de entrenamiento; si una sesión se repite martes y viernes, van dos entradas. Las aclaraciones (salida, gymkanas, edades) siguen viviendo en el campo Horario."
        fields:
          - label: "Día"
            name: "day"
            widget: "select"
            options:
              - { label: "Lunes", value: "mon" }
              - { label: "Martes", value: "tue" }
              - { label: "Miércoles", value: "wed" }
              - { label: "Jueves", value: "thu" }
              - { label: "Viernes", value: "fri" }
              - { label: "Sábado", value: "sat" }
              - { label: "Domingo", value: "sun" }
          - { label: "Hora de inicio", name: "start", widget: "string", required: true, pattern: ["^([01][0-9]|2[0-3]):[0-5][0-9]$", "Escribe la hora en formato de 24 horas, HH:MM (ej: 16:30)"], hint: "Formato de 24 horas: 07:00, 16:30" }
          - { label: "Hora de fin", name: "end", widget: "string", required: true, pattern: ["^([01][0-9]|2[0-3]):[0-5][0-9]$", "Escribe la hora en formato de 24 horas, HH:MM (ej: 18:00)"], hint: "Tiene que ser posterior a la hora de inicio" }
          - { label: "Lugar", name: "place", widget: "string", required: false, hint: "Dónde se encuentra el grupo ese día. Déjalo vacío si la sesión no tiene un punto fijo (por ejemplo, una salida por fuera)." }
      - { label: "Duración por sesión", name: "duration", widget: "string", required: false }
      - { label: "Ubicación", name: "location", widget: "string", required: false }
      - { label: "Cupo máximo", name: "maxStudents", widget: "number", required: false }
      - { label: "Requisitos", name: "requirements", widget: "list", required: true }
      - { label: "Equipo necesario", name: "equipmentNeeded", widget: "list", required: false }
      - { label: "Objetivos", name: "objectives", widget: "list", required: false }
      - { label: "Metodología", name: "methodology", widget: "text", required: false }
      - { label: "Inscripciones abiertas", name: "enrollmentOpen", widget: "boolean", default: true }
      - { label: "Costo mensual", name: "monthlyFee", widget: "string", required: false }
      - { label: "Activo", name: "active", widget: "boolean", default: true }
