          - { label: "Meta descripción", name: "metaDescription", widget: "text", required: false, hint: "Máximo 160 caracteres" }
          - { label: "Imagen OG", name: "ogImage", widget: "image", required: false }
      - { label: "Descripción completa", name: "body", widget: "markdown" }

  # ----------------------------------------------------------
  # RESULTADOS (archivo de datos)
  #
  # Un archivo por válida y categoría. De aquí sale el tablero de la
  # general que se pinta en /noticias (SeasonStandings.astro): mientras
  # no haya archivos, el tablero no se pinta.
  #
  # Los corredores son menores: qué nombre se publica lo decide el club.
  # Ante la duda, no se carga la llegada.
  # ----------------------------------------------------------
  - name: "results"
    label: "Resultados"
    label_singular: "Resultado"
    folder: "src/content/results"
    create: true
    # El evento ya lleva la fecha adelante y la categoría cierra el nombre:
    # así dos categorías de la misma válida no chocan.
    identifier_field: "eventName"
    slug: "{{fields.event}}-{{fields.category}}"
    extension: "yml"
    format: "yaml"
    sortable_fields: ["date", "eventName", "category"]
    view_groups:
      - label: "Categoría"
        field: category
      - label: "Año"
        field: date
        pattern: '\d{4}'
    summary: "{{date | date('YYYY-MM-DD')}} — {{eventName}} · {{category}}"
    fields:
      - { label: "Evento (slug)", name: "event", widget: "string", required: true, hint: "Slug del evento en Eventos, ej: 2026-03-copa-valle-i-ginebra. Es lo que junta las categorías de una misma válida en el tablero" }
      - { label: "Nombre del evento", name: "eventName", widget: "string", required: true, hint: "Como lo publica el organizador, ej: I Válida Copa Valle 2026 - Ginebra" }
      - { label: "Fecha", name: "date", widget: "datetime", required: true, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false, hint: "Día de la carrera. Ordena las válidas: la más reciente es la que el tablero marca como 'esta válida'" }
      - { label: "Categoría de carrera", name: "category", widget: "string", required: true, hint: "Tal como la publica el organizador, ej: Infantil A. Escríbela IGUAL en todas las válidas: el tablero agrupa por nombre + categoría" }
      - label: "Posiciones"
        name: "positions"
        widget: "list"
        required: true
        summary: "{{fields.position}}. {{fields.riderName}} ({{fields.points}} pts)"
        hint: "Llegada por llegada, de la primera posición a la última"
        fields:
          - { label: "Posición", name: "position", widget: "number", value_type: "int", min: 1, hint: "Puesto de llegada. Desempata la general: con el mismo total va primero quien acumule mejores puestos" }
          - { label: "Corredor (slug)", name: "rider", widget: "string", required: false, hint: "Identificador en Corredores, ej: ana-ejemplo. Opcional" }
          - { label: "Nombre del corredor", name: "riderName", widget: "string", hint: "Como debe aparecer publicado" }
          - { label: "Tiempo", name: "time", widget: "string", required: false, hint: "Ej: 0:42:15" }
          - { label: "Puntos", name: "points", widget: "number", required: false, value_type: "int", min: 0, hint: "Puntos de la válida. Si se deja vacío suma 0 y el corredor sigue en la general" }
      - { label: "Destacados del club", name: "clubHighlights", widget: "text", required: false, hint: "Qué contar de esta carrera, en una o dos frases" }
      - { label: "Total participantes", name: "totalParticipants", widget: "number", required: false, value_type: "int", min: 0, hint: "Cuántos largaron en la categoría" }

  # ----------------------------------------------------------
  # RUTAS
