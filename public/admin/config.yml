      - { label: "Color del protector", name: "protectorColor", widget: "string", required: false }
      - { label: "Categoría", name: "category", widget: "select", options: ["frutal", "ornamental", "nativo", "maderable"], default: "nativo" }
      - { label: "Foto del árbol", name: "image", widget: "image" }
      - { label: "Alt de la foto", name: "imageAlt", widget: "string" }
      - { label: "Estado", name: "status", widget: "select", options: ["sembrado", "creciendo", "floreciendo"], default: "sembrado" }
      - { label: "Notas", name: "notes", widget: "string", required: false }
      - { label: "Donante", name: "donor", widget: "string", required: false }
      - { label: "Destacado", name: "featured", widget: "boolean", default: false }
      - { label: "Borrador", name: "draft", widget: "boolean", default: false }
      - { label: "Orden", name: "order", widget: "number", default: 0 }
      - { label: "Contenido", name: "body", widget: "markdown", required: false }

