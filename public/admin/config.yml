        options:
          - { label: "Pre-infantil", value: "pre-infantil" }
          - { label: "Infantil", value: "infantil" }
          - { label: "Juvenil", value: "juvenil" }
          - { label: "Elite", value: "elite" }
          - { label: "Recreativo", value: "recreativo" }
      - { label: "Programas (slugs)", name: "usedInPrograms", widget: "list", required: false }
      - { label: "Activo", name: "active", widget: "boolean", default: true }
      - { label: "Orden", name: "order", widget: "number", default: 0 }
      - { label: "Borrador", name: "draft", widget: "boolean", default: false }
      - label: "SEO"
        name: "seo"
        widget: "object"
        collapsed: true
        required: false
        fields:
          - { label: "Meta título", name: "metaTitle", widget: "string", required: false }
          - { label: "Meta descripción", name: "metaDescription", widget: "text", required: false }
          - { label: "Imagen OG", name: "ogImage", widget: "image", required: false }
      - { label: "Descripción completa", name: "body", widget: "markdown" }

  # ----------------------------------------------------------
  # PÁGINAS ESTÁTICAS
  # ----------------------------------------------------------
  - name: "pages"
    label: "Páginas"
    label_singular: "Página"
    folder: "src/content/pages"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string", required: true }
      - { label: "Descripción", name: "description", widget: "text", required: false }
      - { label: "Imagen", name: "image", widget: "image", required: false }
      - label: "Layout"
        name: "layout"
        widget: "select"
        default: "page"
        options:
          - { label: "Página estándar", value: "page" }
          - { label: "Ancho completo", value: "fullwidth" }
          - { label: "Landing page", value: "landing" }
      - { label: "Mostrar en navegación", name: "showInNav", widget: "boolean", default: false }
      - { label: "Orden", name: "order", widget: "number", default: 0 }
      - { label: "Borrador", name: "draft", widget: "boolean", default: false }
      # Solo lo usa la página "programas": los textos del selector de edad que
      # aparece encima de la ruta de formación. Las edades de los botones NO se
      # escriben aquí, salen de "Edad mínima"/"Edad máxima" de cada programa.
      - label: "Selector de edad (solo página «programas»)"
        name: "agePicker"
        widget: "object"
        collapsed: true
        required: false
        fields:
          - { label: "Pregunta", name: "legend", widget: "string", hint: "Ej.: ¿Qué edad tiene tu hijo?" }
          - { label: "Aclaración", name: "hint", widget: "text", required: false }
          - { label: "Texto de «sin filtro»", name: "allLabel", widget: "string", default: "Todas las edades" }
      - label: "SEO"
        name: "seo"
        widget: "object"
        collapsed: true
        required: false
        fields:
          - { label: "Meta título", name: "metaTitle", widget: "string", required: false }
          - { label: "Meta descripción", name: "metaDescription", widget: "text", required: false }
          - { label: "Imagen OG", name: "ogImage", widget: "image", required: false }
      - { label: "Contenido", name: "body", widget: "markdown" }

  # ----------------------------------------------------------
  # CONFIGURACIÓN DEL SITIO
  # ----------------------------------------------------------
  # No hay colección `settings`: los datos del sitio (nombre, contacto, redes,
  # navegación, etiquetas de CTA) viven en `src/lib/constants.ts` y ninguna
  # página lee un YAML. La colección que existía aquí apuntaba a
  # `src/content/settings/site.yaml`, un archivo que nunca se creó.

