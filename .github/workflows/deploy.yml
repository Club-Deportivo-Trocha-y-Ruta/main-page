# ============================================================
# CI/CD — Club Deportivo Trocha y Ruta
# ============================================================
# Trigger: push (merge) a develop
# Pipeline: checkout → node setup → install → typecheck
#           → test → build → deploy FTPS
#
# Cada paso es un gate: si falla, el pipeline se detiene
# y el deploy NO se ejecuta.
#
# Environment: QA
#   Las variables y secrets se configuran en GitHub bajo
#   Settings → Environments → QA.
#   El environment determina qué valores se inyectan —
#   no es necesario usar nombres distintos por entorno.
#
# Variables requeridas en Environment develop:
#   PUBLIC_WEB3FORMS_KEY          → API key de Web3Forms
#   PUBLIC_CLOUDINARY_CLOUD_NAME  → Cloud name de Cloudinary
#   PUBLIC_GA4_MEASUREMENT_ID     → Measurement ID GA4 (G-XXXXXXXXXX)
#
# Secrets requeridos en Environment develop:
#   FTP_SERVER    → hostname FTP de staging (Hostinger)
#   FTP_USERNAME  → usuario FTP
#   FTP_PASSWORD  → contraseña FTP
# ============================================================

name: CI/CD → Develop

on:
  push:
    # Solo se activa cuando se hace push/merge a develop.
    # Los commits en feature branches NO disparan este workflow.
    branches:
      - develop

# Cancela cualquier pipeline anterior en cola para develop si llega uno nuevo.
# Evita deploys simultáneos y condiciones de carrera en public_html.
concurrency:
  group: deploy-develop
  cancel-in-progress: true

jobs:
  ci:
    name: Verificación de calidad
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. Checkout ───────────────────────────────────────
      - name: Checkout código fuente
        uses: actions/checkout@v6

      # ── 2. Setup Node.js ──────────────────────────────────
      - name: Configurar Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          # Activa el caché de npm automáticamente usando package-lock.json
          # como clave. Reduce npm ci de ~45s a ~8s en runs siguientes.
          cache: 'npm'

      # ── 3. Instalar dependencias ──────────────────────────
      - name: Instalar dependencias
        # npm ci garantiza instalación limpia y reproducible desde
        # package-lock.json. Es el estándar para entornos de CI.
        run: npm ci

      # ── 4. Type check ─────────────────────────────────────
      - name: Verificar tipos (astro check)
        run: npm run typecheck

      # ── 5. Tests unitarios — GATE DE CALIDAD ─────────────
      # Si algún test falla, el pipeline se detiene aquí.
      # El build y el deploy NO se ejecutan.
      - name: Ejecutar pruebas unitarias (Vitest)
        run: npm test

  deploy:
    name: Build & Deploy a Hostinger (develop)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # El deploy solo se ejecuta si el job de CI pasa completamente.
    # Cualquier fallo en typecheck o tests bloquea este job.
    needs: ci
    # El environment QA inyecta sus propias variables y secrets en este job.
    # GitHub descarga los valores configurados bajo Settings → Environments → QA
    # antes de ejecutar cualquier step. Esto permite usar nombres genéricos
    # (FTP_SERVER, PUBLIC_GA4_MEASUREMENT_ID) en ambos workflows sin colisión.
    environment: develop

    steps:
      # ── 1. Checkout ───────────────────────────────────────
      - name: Checkout código fuente
        uses: actions/checkout@v6

      # ── 2. Setup Node.js ──────────────────────────────────
      - name: Configurar Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      # ── 3. Instalar dependencias ──────────────────────────
      - name: Instalar dependencias
        run: npm ci

      # ── 4. Build Astro ────────────────────────────────────
      # astro check + astro build. Genera el directorio dist/
      # con el sitio estático listo para subir a Hostinger.
      - name: Build Astro (QA)
        run: npm run build
        env:
          # Variables públicas incrustadas en el HTML durante el build.
          # Se configuran como "Variables" (no Secrets) en el Environment develop
          # porque su valor ya es visible en el código fuente del cliente.
          PUBLIC_WEB3FORMS_KEY: ${{ vars.PUBLIC_WEB3FORMS_KEY }}
          PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ vars.PUBLIC_CLOUDINARY_CLOUD_NAME }}
          PUBLIC_GA4_MEASUREMENT_ID: ${{ vars.PUBLIC_GA4_MEASUREMENT_ID }}

      # ── 5. Setup lftp ─────────────────────────────────────
      # SamKirkland/FTP-Deploy-Action fallaba consistentemente con
      # Hostinger por ECONNRESET / FIN packet durante uploads masivos.
      # lftp maneja reintentos automáticos, reanudación de uploads
      # interrumpidos y reconexión transparente.
      - name: Instalar lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      # ── 6. Deploy FTPS via lftp ───────────────────────────
      # mirror -R sube recursivamente solo archivos modificados.
      # Reintentos automáticos en caso de desconexión del servidor.
      - name: Deploy a Hostinger via lftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set net:max-retries 10;
            set net:reconnect-interval-base 5;
            set net:reconnect-interval-multiplier 1.5;
            set net:reconnect-interval-max 60;
            set net:timeout 30;
            set net:persist-retries 5;
            set mirror:parallel-transfer-count 4;
            set xfer:clobber on;
            open -u \"$FTP_USER\",\"$FTP_PASS\" \"$FTP_SERVER\";
            mirror --reverse \
                   --only-newer \
                   --verbose \
                   --parallel=4 \
                   --exclude-glob .git*/ \
                   --exclude-glob node_modules/ \
                   --exclude-glob .ftp-deploy-sync-state.json \
                   ./dist/ /public_html/;
          "
