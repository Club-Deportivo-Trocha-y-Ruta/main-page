# ============================================================
# CI/CD — Club Deportivo Trocha y Ruta (Producción)
# ============================================================
# Trigger: push (merge) a main
# Pipeline: checkout → node setup → install → build → deploy FTPS
#
# A diferencia del pipeline de develop, este NO ejecuta tests
# ni typecheck como gate. El build se ejecuta directamente.
#
# Secrets requeridos en GitHub (producción):
#   FTP_SERVER_PROD   → hostname FTP de producción
#   FTP_USERNAME_PROD → usuario FTP de producción
#   FTP_PASSWORD_PROD → contraseña FTP de producción
#
# Variables requeridas (Settings → Secrets and variables → Variables):
#   PUBLIC_WEB3FORMS_KEY          → API key de Web3Forms
#   PUBLIC_CLOUDINARY_CLOUD_NAME  → Cloud name de Cloudinary
# ============================================================

name: Deploy → Producción

on:
  push:
    branches:
      - main

# Cancela cualquier pipeline anterior en cola para main si llega uno nuevo.
concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy a Producción
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Checkout ───────────────────────────────────────
      - name: Checkout código fuente
        uses: actions/checkout@v4

      # ── 2. Setup Node.js ──────────────────────────────────
      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Instalar dependencias ──────────────────────────
      - name: Instalar dependencias
        run: npm ci

      # ── 4. Build Astro ────────────────────────────────────
      - name: Build producción Astro
        run: npm run build
        env:
          PUBLIC_WEB3FORMS_KEY: ${{ vars.PUBLIC_WEB3FORMS_KEY }}
          PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ vars.PUBLIC_CLOUDINARY_CLOUD_NAME }}

      # ── 5. Deploy FTPS incremental ────────────────────────
      - name: Deploy a Producción via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER_PROD }}
          username: ${{ secrets.FTP_USERNAME_PROD }}
          password: ${{ secrets.FTP_PASSWORD_PROD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: /public_html/
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .ftp-deploy-sync-state.json
          dry-run: false
