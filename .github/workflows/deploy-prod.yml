# ============================================================
# CI/CD — Club Deportivo Trocha y Ruta (Producción)
# ============================================================
# Trigger: push (merge) a main
# Pipeline: checkout → node setup → install → build → deploy FTPS
#
# A diferencia del pipeline de develop, este NO ejecuta tests
# ni typecheck como gate. Se asume que el código en main ya
# pasó el CI gate en develop antes del merge.
#
# Environment: production
#   Las variables y secrets se configuran en GitHub bajo
#   Settings → Environments → production.
#   El environment determina qué valores se inyectan —
#   no es necesario usar nombres distintos por entorno.
#
# Variables requeridas en Environment production:
#   PUBLIC_WEB3FORMS_KEY          → API key de Web3Forms
#   PUBLIC_CLOUDINARY_CLOUD_NAME  → Cloud name de Cloudinary
#   PUBLIC_GA4_MEASUREMENT_ID     → Measurement ID GA4 (G-XXXXXXXXXX)
#
# Secrets requeridos en Environment production:
#   FTP_SERVER    → hostname FTP de producción (Hostinger)
#   FTP_USERNAME  → usuario FTP
#   FTP_PASSWORD  → contraseña FTP
# ============================================================

name: Deploy → Producción

on:
  push:
    branches:
      - main

# Cancela cualquier pipeline anterior en cola para main si llega uno nuevo.
concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy a Producción
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # El environment production inyecta sus propias variables y secrets en este job.
    # GitHub descarga los valores configurados bajo Settings → Environments → production
    # antes de ejecutar cualquier step. Esto permite usar nombres genéricos
    # (FTP_SERVER, PUBLIC_GA4_MEASUREMENT_ID) en ambos workflows sin colisión.
    environment: production

    steps:
      # ── 1. Checkout ───────────────────────────────────────
      - name: Checkout código fuente
        uses: actions/checkout@v6

      # ── 2. Setup Node.js ──────────────────────────────────
      - name: Configurar Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      # ── 3. Instalar dependencias ──────────────────────────
      - name: Instalar dependencias
        run: npm ci

      # ── 4. Build Astro ────────────────────────────────────
      - name: Build Astro (production)
        run: npm run build
        env:
          # Variables públicas incrustadas en el HTML durante el build.
          # Se configuran como "Variables" (no Secrets) en el Environment production
          # porque su valor ya es visible en el código fuente del cliente.
          PUBLIC_WEB3FORMS_KEY: ${{ vars.PUBLIC_WEB3FORMS_KEY }}
          PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ vars.PUBLIC_CLOUDINARY_CLOUD_NAME }}
          PUBLIC_GA4_MEASUREMENT_ID: ${{ vars.PUBLIC_GA4_MEASUREMENT_ID }}

      # ── 5. Setup lftp ─────────────────────────────────────
      # SamKirkland/FTP-Deploy-Action fallaba consistentemente con
      # Hostinger por ECONNRESET / FIN packet durante uploads masivos.
      # lftp maneja reintentos automáticos, reanudación de uploads
      # interrumpidos y reconexión transparente.
      - name: Instalar lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      # ── 6. Deploy FTPS via lftp ───────────────────────────
      # mirror -R sube recursivamente comparando size+timestamp.
      # Reintentos automáticos en caso de desconexión del servidor.
      - name: Deploy a Producción via lftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set net:max-retries 10;
            set net:reconnect-interval-base 5;
            set net:reconnect-interval-multiplier 1.5;
            set net:reconnect-interval-max 60;
            set net:timeout 30;
            set net:persist-retries 5;
            set mirror:parallel-transfer-count 4;
            set xfer:clobber on;
            open -u \"$FTP_USER\",\"$FTP_PASS\" \"$FTP_SERVER\";
            mirror --reverse \
                   --only-newer \
                   --verbose \
                   --parallel=4 \
                   --exclude-glob .git*/ \
                   --exclude-glob node_modules/ \
                   --exclude-glob .ftp-deploy-sync-state.json \
                   ./dist/ /public_html/;
          "
